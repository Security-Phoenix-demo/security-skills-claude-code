name: validate

# Every bug that has broken this marketplace was structural: a skill with no
# frontmatter, a directory name with a space in it, two components claiming one slash
# name, a SKILL.md citing a file that was never shipped. All of it is catchable in
# seconds, and none of it was being checked.
#
# Two validators run here because they cover different ground:
#   claude plugin validate      manifest schema and frontmatter shape
#   scripts/validate-marketplace.py  whether the pieces actually fit together
#
# The CLI passes a marketplace whose source points at a missing directory, two skills
# sharing a name, a SKILL.md whose name: disagrees with its directory, and a dead
# references/ path. The script exists for exactly those.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Structure and consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Stdlib only, so there is nothing to install.
      - name: Marketplace, plugins, skills, commands, agents
        run: python3 scripts/validate-marketplace.py

  manifests:
    name: Manifest schema (claude plugin validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `claude plugin validate` needs no API key and makes no network calls — checked
      # against an empty, unauthenticated config directory.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Marketplace manifest
        run: claude plugin validate .

      # Validating the plugin directory covers its components too — verified by
      # breaking a skill's, a command's and an agent's frontmatter in turn and
      # confirming each one fails here.
      #
      # Do NOT add a separate pass over plugins/*/skills. That path is ambiguous to
      # the CLI: given the same version and the same tree it reported "Validating
      # components in" locally but "No manifest found in directory" on the runner.
      # The plugin directory is unambiguous — it holds .claude-plugin/plugin.json —
      # and it makes the extra pass redundant anyway.
      - name: Every plugin, and every skill, command and agent inside it
        run: |
          fail=0
          for d in plugins/*/; do
            echo "::group::${d}"
            claude plugin validate --strict "$d" || fail=1
            echo "::endgroup::"
          done
          exit $fail

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; fail=1; }
          done < <(find plugins scripts -name '*.sh' -type f)
          exit $fail

      # These hooks and the repo scanner run on developer laptops, which still ship
      # bash 3.2. shellcheck catches the bashisms that only fail there — the class that
      # silently disabled the package guard on macOS.
      #
      # This is a hard gate, not advisory. The first run surfaced exactly two findings
      # and both were deliberate, so they carry an inline `shellcheck disable=` with the
      # reason rather than a blanket exemption. Suppress a new finding the same way —
      # with a comment saying why — or fix it.
      #
      # Note SC2207 in particular: its suggested fix is `mapfile`, which is bash 4 only.
      # Taking that advice would break the very platform this check exists to protect.
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fail=0
          while IFS= read -r f; do
            shellcheck -S warning "$f" || fail=1
          done < <(find plugins scripts -name '*.sh' -type f)
          exit $fail

      # Any scripts/test-*.sh is a suite and runs here. Discovered by glob rather than
      # listed by name on purpose: a test that CI does not execute is the same as no
      # test, and this repository has already shipped four bypasses of one function
      # for exactly that reason. A new suite is wired in by being named correctly.
      - name: Shell test suites
        run: |
          fail=0
          found=0
          for t in scripts/test-*.sh; do
            [ -e "$t" ] || continue
            found=1
            echo "::group::$t"
            bash "$t" || { echo "::error file=$t::suite failed"; fail=1; }
            echo "::endgroup::"
          done
          if [ "$found" = 0 ]; then
            # A warning does not fail a job. This step is the only thing that runs the
            # package guard's cases, so "found nothing to run" has to be red — a
            # renamed or deleted suite must not read as a clean build.
            echo "::error::no scripts/test-*.sh found — nothing asserted the hooks' behaviour"
            fail=1
          fi
          exit $fail

  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile every .py
        run: |
          find plugins scripts -name '*.py' -type f -print0 \
            | xargs -0 python3 -m py_compile
          echo "all .py files compile"

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: A real .env must never be committed
        run: |
          if find . -path ./.git -prune -o -name '.env' -type f -print | grep -q .; then
            echo "::error::a committed .env was found — ship .env.example instead"
            find . -path ./.git -prune -o -name '.env' -type f -print
            exit 1
          fi
          echo "no .env files"

      # The scanner used to live inline here, where it could not be run without pushing
      # and could not be tested at all. Four bypasses shipped that way: quoting was
      # required so a bare assignment passed, only the first match on a line was read,
      # .md was excluded wholesale, and any `$` in a value counted as interpolation.
      # It is a script with cases now, and the cases run first — a gate whose own test
      # is failing has no business reporting a clean tree.
      - name: The scanner's own cases
        run: python3 scripts/test-scan-secrets.py

      - name: Key-shaped literals outside narrowly-identified example files
        run: python3 scripts/scan-secrets.py
